name: C Homework Checks
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile each exercise
        run: |
          mkdir -p build
          for source in src/*.c; do
            gcc -std=c11 -Wall -Wextra -Werror "$source" -o "build/$(basename "$source" .c)"
          done
      - name: Run exercise checks
        run: python3 tests/verify.py
